services:
  - type: web
    name: nexora-api
    env: python
    rootDir: apps/backend
    buildCommand: pip install -r requirements.txt || pip install -r apps/backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: PYTHONPATH
        value: .
      - key: APP_MODE
        value: PERSONAL
      - key: ADMIN_EMAIL
        value: p.vishu2685@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AI_PROVIDER
        value: huggingface
      - key: NEXORA_MODEL_ID
        value: vishvam26/nexora-qwen3.5-4b-merged
      - key: NEXT_PUBLIC_API_URL
        sync: false
