services:
  - type: web
    name: nexora-api
    env: python
    rootDir: apps/backend
    buildCommand: pip install -r requirements.txt || pip install -r apps/backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: PYTHONPATH
        value: .
      - key: APP_MODE
        value: PERSONAL
      - key: ADMIN_EMAIL
        value: p.vishu2685@gmail.com
      - key: ADMIN_PASSWORD
        value: p.vishvam@2685
      - key: DATABASE_URL
        value: ""
      - key: QDRANT_URL
        value: "YOUR_QDRANT_CLUSTER_URL"
      - key: QDRANT_API_KEY
        value: "YOUR_QDRANT_API_KEY"
