services:
  db:
    image: postgres:16-alpine
    container_name: nexora-postgres
    restart: always
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora_secure_password_2026
      POSTGRES_DB: nexora_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: ../../docker/backend.Dockerfile
    container_name: nexora-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./apps/backend/.env
    volumes:
      - backend_storage:/app/storage

volumes:
  postgres_data:
  backend_storage:
